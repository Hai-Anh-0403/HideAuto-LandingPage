thing to a server.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div data-faq=\"closed\" style=\"border-top:1px solid var(--ln2)\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onFaq }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;padding:20px 0;background:transparent;border:0;text-align:left;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;color:var(--fg)\"><span data-t=\"vi\">Chạy được trên nền tảng nào?<\u002Fspan><span data-t=\"en\">Which platforms are supported?<\u002Fspan><span data-plus=\"1\" style=\"flex-shrink:0;font-family:ui-monospace,monospace;font-size:18px;color:var(--ac)\">+<\u002Fspan><\u002Fbutton>\n        <p style=\"padding:0 0 22px;max-width:760px;font-size:15.5px;line-height:1.65;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Bản beta chạy trên Windows, cài qua launcher tự cập nhật nên không phải tải tay từng bản mới. Giao diện song ngữ Việt / Anh, đổi ngay trong app.<\u002Fspan><span data-t=\"en\">The beta runs on Windows, installed through a self-updating launcher so you never re-download a build by hand. The interface is bilingual Vietnamese / English, switchable in-app.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"download\" data-screen-label=\"Download\" style=\"padding:96px 34px 0\">\n  <div class=\"blueprint\" style=\"position:relative;max-width:1280px;margin:0 auto;border:1px solid var(--ln);padding:60px 56px;text-align:center\">\n    <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n    <h2 style=\"font-size:64px;letter-spacing:-.025em;max-width:840px;margin:0 auto\"><span data-t=\"vi\">Dựng flow đầu tiên, để Critic soát, rồi chạy 300 profile.<\u002Fspan><span data-t=\"en\">Build your first flow, let Critic review it, then run 300 profiles.<\u002Fspan><\u002Fh2>\n    <p style=\"margin:22px auto 0;max-width:600px;font-size:17px;line-height:1.62;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Miễn phí trong beta. Chạy cục bộ trên Windows. Không cần thẻ, không cần tài khoản cloud.<\u002Fspan><span data-t=\"en\">Free during the beta. Runs locally on Windows. No card, no cloud account.<\u002Fspan><\u002Fp>\n    <div style=\"display:flex;gap:12px;justify-content:center;margin-top:32px\">\n      <a href=\"#top\" style=\"padding:14px 30px;background:var(--ac);color:var(--on-ac);font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;letter-spacing:.02em\"><span data-t=\"vi\">Tải HideAuto cho Windows<\u002Fspan><span data-t=\"en\">Download HideAuto for Windows<\u002Fspan><\u002Fa>\n      <a href=\"#features\" style=\"padding:14px 26px;border:1px solid var(--ln);color:var(--fg);font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;letter-spacing:.02em\"><span data-t=\"vi\">Xem lại tính năng<\u002Fspan><span data-t=\"en\">Review the features<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n    <p style=\"margin:18px 0 0;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;color:var(--mut)\"><span data-t=\"vi\">Launcher tự cập nhật · Song ngữ VI / EN · Dữ liệu ở lại máy bạn<\u002Fspan><span data-t=\"en\">Self-updating launcher · Bilingual VI / EN · Your data stays local<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer data-screen-label=\"Footer\" style=\"margin-top:88px;padding:44px 34px;border-top:1px solid var(--ln2)\">\n  <div style=\"max-width:1280px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:48px;flex-wrap:wrap\">\n    <div>\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <svg sc-camel-view-box=\"0 0 40 40\" style=\"width:22px;height:22px;display:block\" aria-hidden=\"true\"><rect x=\".5\" y=\".5\" width=\"39\" height=\"39\" fill=\"none\" stroke=\"var(--fg)\"><\u002Frect><rect x=\"11\" y=\"9\" width=\"4\" height=\"22\" fill=\"var(--ac)\"><\u002Frect><rect x=\"25\" y=\"9\" width=\"4\" height=\"22\" fill=\"var(--ac)\"><\u002Frect><rect x=\"11\" y=\"18\" width=\"18\" height=\"4\" fill=\"var(--ac)\"><\u002Frect><\u002Fsvg>\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600\">HideAuto<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin-top:12px;max-width:400px;font-size:14px;line-height:1.6;color:var(--mut)\"><span data-t=\"vi\">Automation trình duyệt trực quan, chạy cục bộ, có cửa kiểm trước khi ship.<\u002Fspan><span data-t=\"en\">Visual browser automation that runs locally, with a gate before you ship.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:56px;flex-wrap:wrap\">\n      <div>\n        <p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)\"><span data-t=\"vi\">Sản phẩm<\u002Fspan><span data-t=\"en\">Product<\u002Fspan><\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:14px;font-size:14px\">\n          <a href=\"#features\" style=\"color:var(--fg2)\"><span data-t=\"vi\">Tính năng<\u002Fspan><span data-t=\"en\">Features<\u002Fspan><\u002Fa>\n          <a href=\"#critic\" style=\"color:var(--fg2)\">Critic &amp; gate<\u002Fa>\n          <a href=\"#pricing\" style=\"color:var(--fg2)\"><span data-t=\"vi\">Giá<\u002Fspan><span data-t=\"en\">Pricing<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)\"><span data-t=\"vi\">Tài nguyên<\u002Fspan><span data-t=\"en\">Resources<\u002Fspan><\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:14px;font-size:14px\">\n          <a href=\"#faq\" style=\"color:var(--fg2)\">FAQ<\u002Fa>\n          <a href=\"#compare\" style=\"color:var(--fg2)\"><span data-t=\"vi\">So sánh<\u002Fspan><span data-t=\"en\">Compare<\u002Fspan><\u002Fa>\n          <a href=\"#download\" style=\"color:var(--fg2)\"><span data-t=\"vi\">Tải về<\u002Fspan><span data-t=\"en\">Download<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1280px;margin:32px auto 0;padding-top:20px;border-top:1px solid var(--ln2);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.05em;color:var(--mut)\">\n    <span>© 2026 HideAuto<\u002Fspan>\n    <span><span data-t=\"vi\">Bản beta · nội dung dựng từ source hiện tại<\u002Fspan><span data-t=\"en\">Beta · copy derived from the current source<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;heroVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;2&quot;,&quot;3&quot;],&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;'1' | '2' | '3'&quot;,&quot;section&quot;:&quot;Hero&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#5980a6&quot;,&quot;#416180&quot;,&quot;#728fab&quot;],&quot;default&quot;:&quot;#5980a6&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;cornerMarks&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props)\n    this.root = React.createRef()\n  }\n\n  get el() {\n    return this.root.current || document.querySelector('[data-l][data-hero]')\n  }\n\n  componentDidMount() {\n    const el = this.el\n    if (el) {\n      const saved = this.readLang()\n      if (saved) el.dataset.l = saved\n      const theme = this.read('hideauto.landing.theme', ['light', 'dark']) || this.props.theme\n      if (theme) el.dataset.theme = theme\n      if (this.props.heroVariant) el.dataset.hero = String(this.props.heroVariant)\n      // Only an explicit, non-default pick overrides the theme's own accent —\n      // writing the default inline would beat [data-theme=\"dark\"]{--ac}.\n      if (this.props.accent && this.props.accent !== '#5980a6') {\n        el.style.setProperty('--ac-override', this.props.accent)\n      }\n      if (this.props.cornerMarks === false) el.dataset.marks = 'off'\n    }\n    this.drawIcons()\n    this.fitFrame()\n    this.startSim()\n    this.onResize = () => this.fitFrame()\n    window.addEventListener('resize', this.onResize)\n  }\n\n  /* The app window is authored at its real 1280px so every panel width, node\n     position and table column matches the screenshots; it is then scaled to\n     whatever the page column actually is. Re-tuning 40 internal numbers per\n     breakpoint would lose the fidelity that is the whole point. */\n  fitFrame() {\n    const box = document.querySelector('[data-fit]')\n    const frame = box && box.querySelector('[data-sim]')\n    if (!box || !frame) return\n    const scale = Math.min(1, box.clientWidth / 1280)\n    frame.style.transform = 'scale(' + scale + ')'\n    box.style.height = Math.round(frame.offsetHeight * scale) + 'px'\n  }\n\n  componentDidUpdate() {\n    this.drawIcons()\n  }\n\n  componentWillUnmount() {\n    this.simStop = true\n    clearTimeout(this.simTimer)\n    if (this.onResize) window.removeEventListener('resize', this.onResize)\n  }\n\n  /* ---- simulated test run inside the mockup ------------------------------\n     Mirrors the real editor: pressing Chạy switches the dock to Nhật ký, each\n     node pulses then takes a check, the edge into it marches, and the log\n     appends a step-finished line. Pauses while the pointer is over the frame\n     so the copy stays readable. */\n  startSim() {\n    const frame = document.querySelector('[data-sim]')\n    if (!frame) return\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {\n      this.simSet(frame, 4)\n      return\n    }\n    frame.addEventListener('mouseenter', () => { this.simHold = true })\n    frame.addEventListener('mouseleave', () => { this.simHold = false })\n\n    const LEN = { canvas: 5, problems: 7, home: 9, sched: 25 }\n    let step = -1\n    const tick = () => {\n      if (this.simStop) return\n      const pane = (this.el && this.el.dataset.mk) || 'canvas'\n      if (pane !== this.simPane) {\n        this.simPane = pane\n        step = -1\n      }\n      if (!this.simHold) {\n        step = step + 1 > LEN[pane] ? -1 : step + 1\n        if (pane === 'canvas') this.simSet(frame, step)\n        else if (pane === 'problems') this.simReview(frame, step)\n        else if (pane === 'home') this.simHome(frame, step)\n        else this.simSched(frame, step)\n      }\n      this.simTimer = setTimeout(tick, pane === 'sched' ? 900 : step < 0 ? 900 : 1150)\n    }\n    tick()\n  }\n\n  /* Problems: the review runs, findings land one by one, the gate resolves. */\n  simReview(frame, step) {\n    const pane = frame.querySelector('[data-mkp=\"problems\"]')\n    if (!pane) return\n    const en = (this.el && this.el.dataset.l) === 'en'\n    const rows = pane.querySelectorAll('[data-pr]')\n    const btn = pane.querySelector('[data-review]')\n    const gate = pane.querySelector('[data-gate]')\n    const scanning = step >= 0 && step < rows.length\n\n    rows.forEach((el, i) => { el.dataset.pr = step > i ? 'on' : 'off' })\n\n    if (btn) {\n      btn.style.borderColor = scanning ? '#7ba2ca' : 'rgba(231,232,234,.14)'\n      // the label is a bilingual pair, so write both spans rather than lastChild\n      const pair = btn.querySelectorAll('[data-t]')\n      if (pair.length === 2) {\n        pair[0].textContent = scanning ? 'Đang phản biện…' : 'Chạy phản biện'\n        pair[1].textContent = scanning ? 'Reviewing…' : 'Run critic review'\n      }\n    }\n    if (gate) {\n      const settled = step > rows.length\n      gate.style.borderColor = settled ? '#d98d86' : 'rgba(231,232,234,.14)'\n      const S = '<strong style=\"color:#d98d86;font-weight:700\">79/85<\u002Fstrong>'\n      // rebuilt with the pairs intact so a VI/EN switch still lands here\n      gate.innerHTML = settled\n        ? '<span data-t=\"vi\">CỬA CRITIC<\u002Fspan><span data-t=\"en\">CRITIC GATE<\u002Fspan> ' + S +\n          ' <span data-t=\"vi\">BỊ CHẶN<\u002Fspan><span data-t=\"en\">BLOCKED<\u002Fspan>'\n        : '<span data-t=\"vi\">CHƯA PHẢN BIỆN<\u002Fspan><span data-t=\"en\">NOT REVIEWED YET<\u002Fspan>'\n    }\n  }\n\n  /* Overview: the figures fill in the way the 15s snapshot refresh fills them. */\n  simHome(frame, step) {\n    const pane = frame.querySelector('[data-mkp=\"home\"]')\n    if (!pane) return\n    const cells = pane.querySelectorAll('[data-kpi]')\n    // fills once on entry, then holds — re-zeroing every loop read as a glitch\n    if (this.homeFilled && step >= 0) return\n    cells.forEach((el) => {\n      if (!el.dataset.kv) el.dataset.kv = el.textContent\n      const target = el.dataset.kv\n      const pct = target.indexOf('%') > -1\n      if (step < 0) { el.textContent = pct ? '0.0%' : '0'; return }\n      const num = parseFloat(target)\n      if (isNaN(num)) return\n      const p = Math.min(1, step / 5)\n      el.textContent = pct ? (num * p).toFixed(1) + '%' : String(Math.round(num * p))\n    })\n    if (step >= 5) this.homeFilled = true\n    if (step < 0) this.homeFilled = false\n  }\n\n  /* Schedules: the 24 h horizon marker walks, like the cron engine ticking. */\n  simSched(frame, step) {\n    const pane = frame.querySelector('[data-mkp=\"sched\"]')\n    const now = pane && pane.querySelector('[data-now]')\n    if (!now) return\n    now.style.left = Math.max(0, (step / 25) * 100) + '%'\n  }\n\n  simSet(frame, step) {\n    this.simStep = step\n    const nodes = frame.querySelectorAll('[data-n]')\n    const edges = frame.querySelectorAll('path[data-e]')\n    const logs = frame.querySelectorAll('[data-lg]')\n    const state = (i) => (step < 0 ? 'idle' : i < step ? 'done' : i === step ? 'run' : 'idle')\n\n    nodes.forEach((el, i) => { el.dataset.s = state(i) })\n    edges.forEach((el, i) => { el.dataset.s = state(i + 1) })\n    logs.forEach((el, i) => { el.dataset.lg = step > i ? 'on' : 'off' })\n\n    const running = step >= 0 && step < nodes.length\n    // a manual dock click takes ownership — the run must not fight the user\n    if (!this.simDockLocked) frame.dataset.dk = step < 0 ? 'problems' : 'log'\n\n    // these three read from the run, so they cannot be authored as data-t pairs\n    const en = (this.el && this.el.dataset.l) === 'en'\n    const t = (vi, eng) => (en ? eng : vi)\n\n    const label = frame.querySelector('[data-runlabel]')\n    if (label) label.textContent = running ? t('Dừng', 'Stop') : t('Chạy', 'Run')\n    const btn = frame.querySelector('[data-runbtn]')\n    if (btn) btn.style.background = running ? '#d98d86' : '#7ba2ca'\n\n    const dot = frame.querySelector('[data-conn]')\n    const conn = frame.querySelector('[data-conntext]')\n    if (dot) dot.style.background = step >= 1 ? '#7ba2ca' : '#6d7075'\n    if (conn) {\n      conn.textContent = step >= 1\n        ? t('ĐÃ KẾT NỐI · 9223', 'CONNECTED · 9223')\n        : t('CHƯA KẾT NỐI', 'NOT CONNECTED')\n    }\n\n    const count = frame.querySelector('[data-stepcount]')\n    if (count) {\n      count.textContent = step < 0\n        ? t('chưa chạy', 'not run yet')\n        : running\n          ? t('bước ' + (step + 1) + '/10 · đang chạy', 'step ' + (step + 1) + '/10 · running')\n          : t('xong 4/10 · dừng ở Click Element', '4/10 done · stopped at Click Element')\n    }\n  }\n\n  drawIcons() {\n    if (typeof window === 'undefined' || !window.lucide) {\n      this.iconTimer = this.iconTimer || setTimeout(() => {\n        this.iconTimer = null\n        this.drawIcons()\n      }, 260)\n      return\n    }\n    try {\n      window.lucide.createIcons({ attrs: { 'stroke-width': 1.5 } })\n    } catch (e) {\n      /* icons are decorative — layout stands without them */\n    }\n  }\n\n  read(key, allowed) {\n    try {\n      const v = localStorage.getItem(key)\n      return allowed.indexOf(v) > -1 ? v : null\n    } catch (e) {\n      return null\n    }\n  }\n\n  write(key, value) {\n    try {\n      localStorage.setItem(key, value)\n    } catch (e) {\n      /* private mode — the choice still holds for this session */\n    }\n  }\n\n  readLang() {\n    return this.read('hideauto.landing.lang', ['vi', 'en'])\n  }\n\n  renderVals() {\n    const set = (key, value) => {\n      const el = this.el\n      if (el) el.dataset[key] = value\n    }\n    return {\n      rootRef: this.root,\n      onLang: (e) => {\n        const next = e.currentTarget.dataset.langBtn\n        set('l', next)\n        this.write('hideauto.landing.lang', next)\n        // repaint the run-driven labels in the new language\n        const frame = document.querySelector('[data-sim]')\n        if (frame) this.simSet(frame, this.simStep == null ? -1 : this.simStep)\n      },\n      onTheme: (e) => {\n        const next = e.currentTarget.dataset.themeBtn\n        set('theme', next)\n        this.write('hideauto.landing.theme', next)\n      },\n      onHero: (e) => set('hero', e.currentTarget.dataset.hv),\n      onMock: (e) => {\n        const next = e.currentTarget.dataset.k\n        set('mk', next)\n        this.simPane = null\n        // the rail follows the screen, like the real app's active nav item\n        const frame = document.querySelector('[data-sim]')\n        if (!frame) return\n        frame.querySelectorAll('[data-rail]').forEach((el) => {\n          const on = el.dataset.rail === next || (next === 'problems' && el.dataset.rail === 'canvas')\n          el.style.borderLeftColor = on ? '#e7e8ea' : 'transparent'\n          el.style.color = on ? '#e7e8ea' : 'rgba(231,232,234,.55)'\n        })\n      },\n      onDock: (e) => {\n        const frame = document.querySelector('[data-sim]')\n        if (!frame) return\n        this.simDockLocked = true\n        frame.dataset.dk = e.currentTarget.dataset.dkb\n      },\n      onFx: (e) => set('fx', e.currentTarget.dataset.f),\n      onFaq: (e) => {\n        const item = e.currentTarget.parentElement\n        item.dataset.faq = item.dataset.faq === 'open' ? 'closed' : 'open'\n      }\n    }\n  }\n}\n<\u002Fscript>\n\n\n<div id=\"__claude_design_branding\"><style>#__claude_design_branding{position:fixed;right:16px;bottom:16px;z-index:2147483646;display:flex;align-items:center;gap:7px;height:30px;padding:0 5px 0 10px;border-radius:999px;font-family:\"Anthropic Sans\",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:12.5px;font-weight:400;line-height:1;letter-spacing:normal;text-transform:none;color:#141413;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px rgba(31,30,29,.14),0 2px 10px rgba(0,0,0,.09)}\n#__claude_design_branding *{box-sizing:border-box;margin:0}\n#__claude_design_branding a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}\n#__claude_design_branding a:hover span{text-decoration:underline}\n#__claude_design_branding svg{flex:none}\n#__claude_design_branding a svg{color:#D97757}\n#__claude_design_branding button{width:20px;height:20px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:currentColor;opacity:.55;border:0;background:none;cursor:pointer;flex:none;font:inherit;transition:opacity .14s}\n#__claude_design_branding button:hover{opacity:1;background:rgba(127,127,127,.22)}\n@media print{#__claude_design_branding{display:none}}<\u0
