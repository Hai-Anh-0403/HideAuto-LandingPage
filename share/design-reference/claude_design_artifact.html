-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"57f80a0d-18b3-45d3-9cb9-9af7c7b1ff3c\"><\u002Fscript>\n<script src=\"bd8f095f-ac16-4334-831e-585e74db77c2\"><\u002Fscript>\n<style>\nbody{margin:0;font-family:\"Barlow\",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;background:#f2f2f3}\nbody:has([data-theme=\"dark\"]){background:#0f1114}\n[data-theme=\"light\"]{--color-text:#1d1f20;--color-divider:rgba(29,31,32,.16);--bg:#f2f2f3;--fg:#1d1f20;--fg2:#3d3f42;--ln:rgba(29,31,32,.16);--ln2:rgba(29,31,32,.1);--mut:#5d5d60;--ac:var(--ac-override,#5980a6);--on-ac:#ffffff;--lnk:#3f5f80;--err:#a3524d;--wnl:#b09a72;--wnt:#8a7550;--gr:rgba(29,31,32,.055 n<\u002Fspan><\u002Fspan>\n      <button type=\"button\" data-hv=\"1\" data-hk=\"1\" sc-camel-on-click=\"{{ onHero }}\" style=\"padding:4px 9px;border:1px solid var(--ln);font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.05em;cursor:pointer\">1 · COCKPIT<\u002Fbutton>\n      <button type=\"button\" data-hv=\"2\" data-hk=\"2\" sc-camel-on-click=\"{{ onHero }}\" style=\"padding:4px 9px;border:1px solid var(--ln);font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.05em;cursor:pointer\">2 · SPEC SHEET<\u002Fbutton>\n      <button type=\"button\" data-hv=\"3\" data-hk=\"3\" sc-camel-on-click=\"{{ onHero }}\" style=\"padding:4px 9px;border:1px solid var(--ln);font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.05em;cursor:pointer\">3 · GATE<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div data-h=\"1\" style=\"padding:58px 0 0;text-align:center;max-width:900px;margin:0 auto\">\n      <div style=\"display:inline-flex;align-items:center;gap:9px;padding:5px 12px;border:1px solid var(--ln);font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)\">\n        <span style=\"width:5px;height:5px;background:var(--ac);animation:wf-blink 2.4s ease-in-out infinite\"><\u002Fspan>\n        <span data-t=\"vi\">Beta · Windows · Chạy cục bộ, dữ liệu ở lại máy bạn<\u002Fspan><span data-t=\"en\">Beta · Windows · Runs locally, data stays on your machine<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:24px 0 0;font-size:86px;line-height:.92;letter-spacing:-.025em\">\n        <span data-t=\"vi\">Automation trình duyệt<br>có <span style=\"color:var(--ac)\">cửa kiểm<\u002Fspan> trước khi chạy thật.<\u002Fspan>\n        <span data-t=\"en\">Browser automation<br>with a <span style=\"color:var(--ac)\">gate<\u002Fspan> before it runs for real.<\u002Fspan>\n      <\u002Fh1>\n      <p style=\"margin:26px auto 0;max-width:700px;font-size:17.5px;line-height:1.62;color:var(--fg2);text-wrap:pretty\">\n        <span data-t=\"vi\">Kéo-thả node thành workflow, chạy song song trên hàng trăm profile anti-detect. Trước khi ship, Critic soát cả flow, chấm điểm và <strong style=\"font-weight:500\">chặn build nếu còn lỗi<\u002Fstrong> — không phải phát hiện lúc 300 profile đã chạy sai.<\u002Fspan>\n        <span data-t=\"en\">Drag nodes into a workflow, run it in parallel across hundreds of anti-detect profiles. Before you ship, Critic reviews the whole flow, scores it, and <strong style=\"font-weight:500\">blocks the build while errors remain<\u002Fstrong> — not after 300 profiles already ran wrong.<\u002Fspan>\n      <\u002Fp>\n      <div style=\"display:flex;gap:12px;justify-content:center;margin-top:32px\">\n        <a href=\"#download\" class=\"blueprint\" style=\"position:relative;padding:13px 26px;background:var(--ac);color:var(--on-ac);font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;letter-spacing:.02em;border:1px solid var(--ac)\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><span data-t=\"vi\">Tải bản beta — miễn phí<\u002Fspan><span data-t=\"en\">Download the beta — free<\u002Fspan><\u002Fa>\n        <a href=\"https://github.com/\" style=\"display:inline-flex;align-items:center;gap:9px;padding:13px 24px;border:1px solid var(--ln);color:var(--fg);font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;letter-spacing:.02em\"><svg sc-camel-view-box=\"0 0 16 16\" style=\"width:17px;height:17px;flex:none\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.07-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.8 space;font-size:10px;color:var(--mut)\">built-in<\u002Fspan><\u002Fspan>\n      <span style=\"padding:7px 15px;border:1px solid var(--ln2);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:.03em;color:var(--fg2)\">Firefox <span style=\"font-family:ui-monospace,monospace;font-size:10px;color:var(--mut)\">built-in<\u002Fspan><\u002Fspan>\n      <span style=\"padding:7px 15px;border:1px solid var(--ln2);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:.03em;color:var(--fg2)\">CDP <span style=\"font-family:ui-monospace,monospace;font-size:10px;color:var(--mut)\">external<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"features\" data-screen-label=\"Features\" style=\"padding:92px 34px 0\">\n  <div style=\"max-width:1280px;margin:0 auto\">\n    <div style=\"max-width:780px\">\n      <p style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ac)\"><span data-t=\"vi\">Vòng lặp vận hành<\u002Fspan><span data-t=\"en\">The operating loop<\u002Fspan><\u002Fp>\n      <h2 style=\"margin-top:16px;font-size:56px;letter-spacing:-.02em\">\n        <span data-t=\"vi\">Dựng · soát · chạy hàng loạt · commit.<\u002Fspan>\n        <span data-t=\"en\">Build · review · run at scale · commit.<\u002Fspan>\n      <\u002Fh2>\n      <p style=\"margin-top:18px;font-size:17px;line-height:1.62;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Bốn việc bạn làm mỗi ngày, trong một app chạy cục bộ. Không tab trình duyệt, không script rời, không chỗ nào dữ liệu rời khỏi máy.<\u002Fspan><span data-t=\"en\">The four things you do every day, in one app that runs locally. No browser tabs, no loose scripts, no point where data leaves your machine.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:36px\">\n      <button type=\"button\" data-f=\"build\" sc-camel-on-click=\"{{ onFx }}\" style=\"padding:9px 17px;border:1px solid var(--ln);font-family:'Barlow Condensed',sans-serif;font-size:15.5px;font-weight:600;letter-spacing:.02em;cursor:pointer\"><span data-t=\"vi\">Canvas &amp; node<\u002Fspan><span data-t=\"en\">Canvas &amp; nodes<\u002Fspan><\u002Fbutton>\n      <button type=\"button\" data-f=\"critic\" sc-camel-on-click=\"{{ onFx }}\" style=\"padding:9px 17px;border:1px solid var(--ln);font-family:'Barlow Condensed',sans-serif;font-size:15.5px;font-weight:600;letter-spacing:.02em;cursor:pointer\">Critic &amp; gate<\u002Fbutton>\n      <button type=\"button\" data-f=\"scale\" sc-camel-on-click=\"{{ onFx }}\" style=\"padding:9px 17px;border:1px solid var(--ln);font-family:'Barlow Condensed',sans-serif;font-size:15.5px;font-weight:600;letter-spacing:.02em;cursor:pointer\"><span data-t=\"vi\">Profile, lịch &amp; quy mô<\u002Fspan><span data-t=\"en\">Profiles, schedule &amp; scale<\u002Fspan><\u002Fbutton>\n      <button type=\"button\" data-f=\"git\" sc-camel-on-click=\"{{ onFx }}\" style=\"padding:9px 17px;border:1px solid var(--ln);font-family:'Barlow Condensed',sans-serif;font-size:15.5px;font-weight:600;letter-spacing:.02em;cursor:pointer\"><span data-t=\"vi\">Lịch sử &amp; git<\u002Fspan><span data-t=\"en\">History &amp; git<\u002Fspan><\u002Fbutton>\n      <button type=\"button\" data-f=\"data\" sc-camel-on-click=\"{{ onFx }}\" style=\"padding:9px 17px;border:1px solid var(--ln);font-family:'Barlow Condensed',sans-serif;font-size:15.5px;font-weight:600;letter-spacing:.02em;cursor:pointer\"><span data-t=\"vi\">Dữ liệu, file &amp; đóng gói<\u002Fspan><span data-t=\"en\">Data, files &amp; packaging<\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n\n    <div data-fxp=\"build\" style=\"grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:56px;align-items:start;margin-top:34px;padding-top:34px;border-top:1px solid var(--ln2)\">\n      <div>\n        <h3 style=\"font-size:32px\"><span data-t=\"vi\">Tám nhóm node, một canvas vô hạn<\u002Fspan><span data-t=\"en\">Eight node groups, one infinite canvas<\u002Fspan><\u002Fh3>\n        <p style=\"margin-top:14px;font-size:15.5px;line-height:1.65;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Kéo node từ palette, nối bằng hai cổng ra — success và error. Rẽ nhánh với IF / IF-ELSE / Element exists, lặp với Loop, dừng với Stop. Biến dùng chung xuyên suốt bằng cú pháp hai ngoặc nhọn.<\u002Fspan><span data-t=\"en\">Drag a node from the palette and wire it through two output ports — success and error. Branch with IF / IF-ELSE / Element exists, repeat with Loop, halt with Stop. Variables travel through everything in double-brace syntax.<\u002Fspan><\u002Fp>\n        <ul style=\"margin:20px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px\">\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">01<\u002Fspan><span data-t=\"vi\">Selector theo id / css / xpath, xuyên shadow DOM và iframe<\u002Fspan><span data-t=\"en\">Selectors by id / css / xpath, through shadow DOM and iframes<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">02<\u002Fspan><span data-t=\"vi\">Chuột human-like và find-by-image cho chỗ selector không tới được<\u002Fspan><span data-t=\"en\">Human-like mouse paths and find-by-image where selectors cannot reach<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">03<\u002Fspan><span data-t=\"vi\">Undo/redo, copy cụm node, canh hàng, dàn bài theo thứ tự chạy<\u002Fspan><span data-t=\"en\">Undo/redo, copy node clusters, alignment, an outline in run order<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">04<\u002Fspan><span data-t=\"vi\">Cần code? Node Run JS, HTTP request và Run command nằm ngay trong flow<\u002Fspan><span data-t=\"en\">Need code? Run JS, HTTP request and Run command nodes sit right in the flow<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--ln);padding:24px 26px\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)\"><span data-t=\"vi\">Bảng node · 8 nhóm<\u002Fspan><span data-t=\"en\">Node palette · 8 groups<\u002Fspan><\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 18px;margin-top:20px\">\n          <div><span style=\"display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600\"><span style=\"width:7px;height:7px;background:var(--ac)\"><\u002Fspan>Browser<\u002Fspan><span style=\"display:block;margin-top:7px;font-family:ui-monospace,monospace;font-size:10.5px;line-height:2;color:var(--mut)\">openConnect<br>browserClose<br>disconnect<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600\"><span style=\"width:7px;height:7px;background:var(--r2)\"><\u002Fspan>Tab<\u002Fspan><span style=\"display:block;margin-top:7px;font-family:ui-monospace,monospace;font-size:10.5px;line-height:2;color:var(--mut)\">gotoUrl · newTab<br>runJs · screenshot<br>httpRequest · scroll<br>cookies · dialog<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600\"><span style=\"width:7px;height:7px;background:var(--r3)\"><\u002Fspan>Element<\u002Fspan><span style=\"display:block;margin-top:7px;font-family:ui-monospace,monospace;font-size:10.5px;line-height:2;color:var(--mut)\">waitForSelector<br>clickElement · hover<br>getText · getHtml<br>elementExists<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600\"><span style=\"width:7px;height:7px;background:var(--r4)\"><\u002Fspan>Keyboard<\u002Fspan><span style=\"display:block;margin-top:7px;font-family:ui-monospace,monospace;font-size:10.5px;line-height:2;color:var(--mut)\">typeText<br>pressKey<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600\"><span style=\"width:7px;height:7px;background:var(--r5)\"><\u002Fspan>Mouse<\u002Fspan><span style=\"display:block;margin-top:7px;font-family:ui-monospace,monospace;font-size:10.5px;line-height:2;color:var(--mut)\">mouseClick · move<br>mouseDown · up<br>imageSearch<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600\"><span style=\"width:7px;height:7px;background:var(--r6)\"><\u002Fspan>Data<\u002Fspan><span style=\"display:block;margin-top:7px;font-family:ui-monospace,monospace;font-size:10.5px;line-height:2;color:var(--mut)\">readSpreadsheet<br>writeFile · convertJson<br>getCode2Fa · random<br>readHotmailAuth<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600\"><span style=\"width:7px;height:7px;background:var(--r7)\"><\u002Fspan>Debug<\u002Fspan><span style=\"display:block;margin-top:7px;font-family:ui-monospace,monospace;font-size:10.5px;line-height:2;color:var(--mut)\">addLog<br>addComment<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600\"><span style=\"width:7px;height:7px;background:var(--ln)\"><\u002Fspan><span data-t=\"vi\">Điều khiển<\u002Fspan><span data-t=\"en\">Control<\u002Fspan><\u002Fspan><span style=\"display:block;margin-top:7px;font-family:ui-monospace,monospace;font-size:10.5px;line-height:2;color:var(--mut)\">if · ifElse<br>loop · stopLoop<br>pause · stop<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-fxp=\"critic\" style=\"grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:56px;align-items:start;margin-top:34px;padding-top:34px;border-top:1px solid var(--ln2)\">\n      <div>\n        <h3 style=\"font-size:32px\"><span data-t=\"vi\">Critic đọc flow trước khi flow chạm production<\u002Fspan><span data-t=\"en\">Critic reads the flow before the flow touches production<\u002Fspan><\u002Fh3>\n        <p style=\"margin-top:14px;font-size:15.5px;line-height:1.65;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Bảy rule tĩnh chạy trên chính graph mà runner sẽ thực thi — không gọi model, nên cùng một flow luôn cho cùng một kết quả. Finding gắn thẳng lên node và lên bảng Problems ở dock đáy.<\u002Fspan><span data-t=\"en\">Seven static rules run on the exact graph the runner will execute — no model calls, so the same flow always scores the same. Findings pin onto the node and into the Problems table in the bottom dock.<\u002Fspan><\u002Fp>\n        <ul style=\"margin:20px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px\">\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">01<\u002Fspan><span data-t=\"vi\">Điểm 0–100, ngưỡng mặc định 85, chỉnh được<\u002Fspan><span data-t=\"en\">Score 0–100, threshold 85 by default, adjustable<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">02<\u002Fspan><span data-t=\"vi\">Một finding mức error là chặn, bất kể điểm còn lại<\u002Fspan><span data-t=\"en\">A single error-level finding blocks, whatever the score<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">03<\u002Fspan><span data-t=\"vi\">Hai rule có nút Apply sửa tự động; còn lại cần bạn quyết<\u002Fspan><span data-t=\"en\">Two rules carry an Apply auto-fix; the rest need your judgement<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">04<\u002Fspan><span data-t=\"vi\">Miễn trừ phải kèm lý do và được ghi lại — người quyết, không phải agent<\u002Fspan><span data-t=\"en\">A waiver needs a reason and is recorded — a human decides, not an agent<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--ln);padding:0;overflow:visible\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"display:grid;grid-template-columns:200px 108px 84px minmax(0,1fr);padding:11px 20px;border-bottom:1px solid var(--ln);font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)\"><span>Rule<\u002Fspan><span><span data-t=\"vi\">Nhóm<\u002Fspan><span data-t=\"en\">Group<\u002Fspan><\u002Fspan><span><span data-t=\"vi\">Mức<\u002Fspan><span data-t=\"en\">Severity<\u002Fspan><\u002Fspan><span>Fix<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:200px 108px 84px minmax(0,1fr);padding:12px 20px;border-bottom:1px solid var(--ln2);font-size:13.5px;align-items:baseline\"><span style=\"font-family:ui-monospace,monospace;font-size:11.5px\">invalid-node<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\">resilience<\u002Fspan><span style=\"display:flex;align-items:center;gap:5px;color:var(--err);font-size:12.5px\"><span style=\"width:7px;height:7px;background:var(--err)\"><\u002Fspan>error<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\"><span data-t=\"vi\">Node lạ / thiếu handler<\u002Fspan><span data-t=\"en\">Unknown node or missing handler<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:200px 108px 84px minmax(0,1fr);padding:12px 20px;border-bottom:1px solid var(--ln2);font-size:13.5px;align-items:baseline\"><span style=\"font-family:ui-monospace,monospace;font-size:11.5px\">no-start-node<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\">resilience<\u002Fspan><span style=\"display:flex;align-items:center;gap:5px;color:var(--err);font-size:12.5px\"><span style=\"width:7px;height:7px;background:var(--err)\"><\u002Fspan>error<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\"><span data-t=\"vi\">Runner từ chối chạy<\u002Fspan><span data-t=\"en\">The runner refuses to run<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:200px 108px 84px minmax(0,1fr);padding:12px 20px;border-bottom:1px solid var(--ln2);font-size:13.5px;align-items:baseline\"><span style=\"font-family:ui-monospace,monospace;font-size:11.5px\">unreachable-node<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\">resilience<\u002Fspan><span style=\"display:flex;align-items:center;gap:5px;color:var(--ac);font-size:12.5px\"><span style=\"width:7px;height:7px;background:var(--ac)\"><\u002Fspan>hint<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\"><span data-t=\"vi\">Không bao giờ chạy tới<\u002Fspan><span data-t=\"en\">Never reached<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:200px 108px 84px minmax(0,1fr);padding:12px 20px;border-bottom:1px solid var(--ln2);font-size:13.5px;align-items:baseline\"><span style=\"font-family:ui-monospace,monospace;font-size:11.5px\">positional-selector<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\">resilience<\u002Fspan><span style=\"display:flex;align-items:center;gap:5px;color:var(--wnt);font-size:12.5px\"><span style=\"width:7px;height:7px;background:var(--wnl)\"><\u002Fspan>warn<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\"><span data-t=\"vi\">Cần người chọn thuộc tính ổn định<\u002Fspan><span data-t=\"en\">A human picks the stable attribute<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:200px 108px 84px minmax(0,1fr);padding:12px 20px;border-bottom:1px solid var(--ln2);font-size:13.5px;align-items:baseline\"><span style=\"font-family:ui-monospace,monospace;font-size:11.5px\">error-port-unwired<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\">data-safety<\u002Fspan><span style=\"display:flex;align-items:center;gap:5px;color:var(--ac);font-size:12.5px\"><span style=\"width:7px;height:7px;background:var(--ac)\"><\u002Fspan>hint<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\"><span data-t=\"vi\">Apply — nối sang Stop mới<\u002Fspan><span data-t=\"en\">Apply — wires to a new Stop<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:200px 108px 84px minmax(0,1fr);padding:12px 20px;border-bottom:1px solid var(--ln2);font-size:13.5px;align-items:baseline\"><span style=\"font-family:ui-monospace,monospace;font-size:11.5px\">zero-dwell<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\">anti-detect<\u002Fspan><span style=\"display:flex;align-items:center;gap:5px;color:var(--wnt);font-size:12.5px\"><span style=\"width:7px;height:7px;background:var(--wnl)\"><\u002Fspan>warn<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\"><span data-t=\"vi\">Apply — trả về nhịp mặc định<\u002Fspan><span data-t=\"en\">Apply — back to the default cadence<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:200px 108px 84px minmax(0,1fr);padding:12px 20px;font-size:13.5px;align-items:baseline\"><span style=\"font-family:ui-monospace,monospace;font-size:11.5px\">write-inside-loop<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\">cost<\u002Fspan><span style=\"display:flex;align-items:center;gap:5px;color:var(--ac);font-size:12.5px\"><span style=\"width:7px;height:7px;background:var(--ac)\"><\u002Fspan>hint<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\"><span data-t=\"vi\">Ghi thừa mỗi vòng lặp<\u002Fspan><span data-t=\"en\">Redundant write each iteration<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-fxp=\"scale\" style=\"grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:56px;align-items:start;margin-top:34px;padding-top:34px;border-top:1px solid var(--ln2)\">\n      <div>\n        <h3 style=\"font-size:32px\"><span data-t=\"vi\">Hàng trăm profile, chạy theo lịch<\u002Fspan><span data-t=\"en\">Hundreds of profiles, running on schedule<\u002Fspan><\u002Fh3>\n        <p style=\"margin-top:14px;font-size:15.5px;line-height:1.65;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Mỗi profile là một danh tính trình duyệt độc lập: fingerprint riêng (UA, WebGL, canvas, font, media device), proxy riêng, bộ nhớ riêng. Chọn profile, đặt maxConcurrency, để engine lo phần còn lại.<\u002Fspan><span data-t=\"en\">Every profile is an isolated browser identity: its own fingerprint (UA, WebGL, canvas, fonts, media devices), its own proxy, its own storage. Pick the profiles, set maxConcurrency, let the engine handle the rest.<\u002Fspan><\u002Fp>\n        <ul style=\"margin:20px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px\">\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">01<\u002Fspan><span data-t=\"vi\">Màn Profiles: lọc, tìm, phân trang, mở/đóng hàng loạt<\u002Fspan><span data-t=\"en\">A Profiles screen: filter, search, paginate, bulk open/close<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">02<\u002Fspan><span data-t=\"vi\">Lịch cron, batch có tiến độ, worklog từng profile<\u002Fspan><span data-t=\"en\">Cron schedules, batches with progress, a worklog per profile<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">03<\u002Fspan><span data-t=\"vi\">Kiểm proxy trước khi chạy — IP, quốc gia, độ trễ<\u002Fspan><span data-t=\"en\">Proxy check before the run — IP, country, latency<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">04<\u002Fspan><span data-t=\"vi\">Mất điện, đóng app: lịch được khôi phục khi mở lại<\u002Fspan><span data-t=\"en\">Power cut, app closed: schedules recover on next launch<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--ln);padding:24px 26px\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)\"><span data-t=\"vi\">Fingerprint mỗi profile<\u002Fspan><span data-t=\"en\">Per-profile fingerprint<\u002Fspan><\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:18px\">\n          <div style=\"padding:11px 0;border-bottom:1px solid var(--ln2);border-right:1px solid var(--ln2);padding-right:18px\"><span style=\"display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)\">User agent<\u002Fspan><span style=\"display:block;margin-top:5px;font-family:ui-monospace,monospace;font-size:11.5px\">Chrome/131 · Win32<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:11px 0 11px 18px;border-bottom:1px solid var(--ln2)\"><span style=\"display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)\">WebGL<\u002Fspan><span style=\"display:block;margin-top:5px;font-family:ui-monospace,monospace;font-size:11.5px\">ANGLE · Intel UHD 630<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:11px 0;border-bottom:1px solid var(--ln2);border-right:1px solid var(--ln2);padding-right:18px\"><span style=\"display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)\">Canvas<\u002Fspan><span style=\"display:block;margin-top:5px;font-family:ui-monospace,monospace;font-size:11.5px\">noise · seed 0x9f41<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:11px 0 11px 18px;border-bottom:1px solid var(--ln2)\"><span style=\"display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)\">Fonts<\u002Fspan><span style=\"display:block;margin-top:5px;font-family:ui-monospace,monospace;font-size:11.5px\">142 <span data-t=\"vi\">font từ dataset<\u002Fspan><span data-t=\"en\">fonts from dataset<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"padding:11px 0;border-bottom:1px solid var(--ln2);border-right:1px solid var(--ln2);padding-right:18px\"><span style=\"display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)\">Media devices<\u002Fspan><span style=\"display:block;margin-top:5px;font-family:ui-monospace,monospace;font-size:11.5px\">2 audio · 1 video<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:11px 0 11px 18px;border-bottom:1px solid var(--ln2)\"><span style=\"display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)\">Proxy<\u002Fspan><span style=\"display:block;margin-top:5px;font-family:ui-monospace,monospace;font-size:11.5px\">socks5 · VN · 62ms<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:11px 18px 0 0;border-right:1px solid var(--ln2)\"><span style=\"display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)\"><span data-t=\"vi\">Chuột<\u002Fspan><span data-t=\"en\">Mouse<\u002Fspan><\u002Fspan><span style=\"display:block;margin-top:5px;font-family:ui-monospace,monospace;font-size:11.5px\">human-like path<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:11px 0 0 18px\"><span style=\"display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)\"><span data-t=\"vi\">Nghỉ giữa bước<\u002Fspan><span data-t=\"en\">Dwell<\u002Fspan><\u002Fspan><span style=\"display:block;margin-top:5px;font-family:ui-monospace,monospace;font-size:11.5px\">0–0.5s <span data-t=\"vi\">ngẫu nhiên<\u002Fspan><span data-t=\"en\">random<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-fxp=\"git\" style=\"grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:56px;align-items:start;margin-top:34px;padding-top:34px;border-top:1px solid var(--ln2)\">\n      <div>\n        <h3 style=\"font-size:32px\"><span data-t=\"vi\">Workflow có lịch sử, không chỉ có bản mới nhất<\u002Fspan><span data-t=\"en\">Workflows have a history, not just a latest version<\u002Fspan><\u002Fh3>\n        <p style=\"margin-top:14px;font-size:15.5px;line-height:1.65;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Mỗi workflow là một file trên đĩa, commit bằng git thật. Xem diff dưới dạng graph (node nào thêm, sửa, xoá) hoặc dạng text. Cấu hình origin thì backup và pull được, có màn giải quyết xung đột.<\u002Fspan><span data-t=\"en\">Every workflow is a file on disk, committed with real git. Read the diff as a graph — which nodes were added, changed, removed — or as text. Configure an origin and you get backup, pull, and a conflict-resolution screen.<\u002Fspan><\u002Fp>\n        <ul style=\"margin:20px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px\">\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">01<\u002Fspan><span data-t=\"vi\">Badge số workflow chưa commit ngay trên thanh điều hướng<\u002Fspan><span data-t=\"en\">A badge on the nav rail counts uncommitted workflows<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">02<\u002Fspan><span data-t=\"vi\">Tab Lịch sử ở dock đáy — xem commit ngay trong lúc sửa<\u002Fspan><span data-t=\"en\">A History tab in the bottom dock — read commits while you edit<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">03<\u002Fspan><span data-t=\"vi\">Ai đó sửa file ngoài app: hộp thoại hỏi trước khi ghi đè<\u002Fspan><span data-t=\"en\">Someone edits the file outside the app: a dialog asks before overwriting<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">04<\u002Fspan><span data-t=\"vi\">Undo/redo trong phiên là một chuyện; commit là chuyện khác<\u002Fspan><span data-t=\"en\">In-session undo/redo is one thing; a commit is another<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--ln);padding:24px 26px\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)\">Graph diff<\u002Fp>\n        <div style=\"margin-top:18px;display:flex;flex-direction:column;gap:9px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.6\">\n          <div style=\"display:flex;gap:11px;padding:9px 12px;border-left:2px solid var(--ac);background:var(--act)\"><span style=\"color:var(--ac)\">+<\u002Fspan><span>node <span style=\"color:var(--mut)\">waitForSelector<\u002Fspan> · \"#add-to-cart-button\"<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;padding:9px 12px;border-left:2px solid var(--ac);background:var(--act)\"><span style=\"color:var(--ac)\">+<\u002Fspan><span>edge <span style=\"color:var(--mut)\">gotoUrl → waitForSelector<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;padding:9px 12px;border-left:2px solid var(--wnl);background:var(--wnt2)\"><span style=\"color:var(--wnt)\">~<\u002Fspan><span>node <span style=\"color:var(--mut)\">clickElement<\u002Fspan> · selector <span style=\"color:var(--err);text-decoration:line-through\">nth-child(3)<\u002Fspan> → <span style=\"color:var(--ac)\">[data-testid]<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;padding:9px 12px;border-left:2px solid var(--err);background:var(--errt)\"><span style=\"color:var(--err)\">−<\u002Fspan><span>node <span style=\"color:var(--mut)\">screenshot<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;padding-top:14px;border-top:1px solid var(--ln2);display:flex;gap:20px;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--mut)\">\n          <span>origin/main · 2 ahead<\u002Fspan><span>3 uncommitted<\u002Fspan><span><span data-t=\"vi\">xung đột: 0<\u002Fspan><span data-t=\"en\">conflicts: 0<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-fxp=\"data\" style=\"grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:56px;align-items:start;margin-top:34px;padding-top:34px;border-top:1px solid var(--ln2)\">\n      <div>\n        <h3 style=\"font-size:32px\"><span data-t=\"vi\">Dữ liệu vào, dữ liệu ra, rồi thành app riêng<\u002Fspan><span data-t=\"en\">Data in, data out, then its own app<\u002Fspan><\u002Fh3>\n        <p style=\"margin-top:14px;font-size:15.5px;line-height:1.65;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Đọc/ghi Excel và Google Sheets, đọc file, ghi txt/csv/json, gửi và đọc mail, lấy mã 2FA, gọi HTTP API giữa flow. Xong rồi đóng gói cả workflow thành một .exe độc lập, đổi icon, mã hoá, có sha256 để đối chiếu.<\u002Fspan><span data-t=\"en\">Read and write Excel and Google Sheets, read files, write txt/csv/json, send and read mail, pull 2FA codes, call any HTTP API mid-flow. Then package the whole workflow into a standalone .exe — custom icon, encrypted, with a sha256 to verify.<\u002Fspan><\u002Fp>\n        <ul style=\"margin:20px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px\">\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">01<\u002Fspan><span data-t=\"vi\">Biến toàn cục có màn riêng — sửa một chỗ, mọi flow theo<\u002Fspan><span data-t=\"en\">Global variables get their own screen — edit once, every flow follows<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">02<\u002Fspan><span data-t=\"vi\">Log JSONL từng bước, tail được ngay trong lúc chạy<\u002Fspan><span data-t=\"en\">Per-step JSONL logs, tailed live while the run happens<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">03<\u002Fspan><span data-t=\"vi\">Cửa Critic là một bước trong pipeline build — chặn được<\u002Fspan><span data-t=\"en\">The Critic gate is a pipeline step in the build — it can block<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px\"><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:10.5px;padding-top:5px\">04<\u002Fspan><span data-t=\"vi\">Launcher tự cập nhật, không phải tải lại tay từng bản<\u002Fspan><span data-t=\"en\">A self-updating launcher — no manual re-download each build<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--ln);padding:24px 26px\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)\">Build pipeline<\u002Fp>\n        <div style=\"margin-top:18px;display:flex;flex-direction:column\">\n          <div style=\"display:grid;grid-template-columns:26px minmax(0,1fr) 90px;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln2);align-items:baseline\"><span style=\"font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ac)\">01<\u002Fspan><span style=\"font-size:14px\"><span data-t=\"vi\">Đọc graph &amp; biến<\u002Fspan><span data-t=\"en\">Read graph &amp; variables<\u002Fspan><\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ac)\">done<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:26px minmax(0,1fr) 90px;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln2);align-items:baseline\"><span style=\"font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ac)\">02<\u002Fspan><span style=\"font-size:14px\">Critic gate <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:var(--mut)\">92/85<\u002Fspan><\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ac)\">pass<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:26px minmax(0,1fr) 90px;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln2);align-items:baseline\"><span style=\"font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ac)\">03<\u002Fspan><span style=\"font-size:14px\"><span data-t=\"vi\">Mã hoá bundle &amp; gắn licence<\u002Fspan><span data-t=\"en\">Encrypt bundle &amp; bind licence<\u002Fspan><\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ac)\">done<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:26px minmax(0,1fr) 90px;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln2);align-items:baseline\"><span style=\"font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ac)\">04<\u002Fspan><span style=\"font-size:14px\"><span data-t=\"vi\">Ghép stub &amp; đổi icon<\u002Fspan><span data-t=\"en\">Assemble stub &amp; set icon<\u002Fspan><\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ac)\">done<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:26px minmax(0,1fr) 90px;gap:12px;padding:11px 0;align-items:baseline\"><span style=\"font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ac)\">05<\u002Fspan><span style=\"font-size:14px\">Attestation<\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ac)\">signed<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;padding:12px 14px;border:1px solid var(--ln2);font-family:ui-monospace,monospace;font-size:10.5px;line-height:1.8;color:var(--mut)\">\n          <span style=\"display:block;color:var(--fg)\">amazon-cart.exe · 84.2 MB<\u002Fspan>\n          <span style=\"display:block\">sha256 · 9f41c8a2…7bd0e134<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"critic\" data-screen-label=\"Critic\" style=\"padding:96px 34px 0\">\n  <div class=\"blueprint\" style=\"position:relative;max-width:1280px;margin:0 auto;border:1px solid var(--ln);background:var(--dk);color:var(--dkt);padding:52px 56px\">\n    <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:60px;align-items:start\">\n      <div>\n        <p style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--st)\"><span data-t=\"vi\">Vì sao cần cửa kiểm<\u002Fspan><span data-t=\"en\">Why a gate<\u002Fspan><\u002Fp>\n        <h2 style=\"margin-top:16px;font-size:52px;letter-spacing:-.02em;color:var(--dkt)\">\n          <span data-t=\"vi\">Lỗi automation không hiện lúc bạn test.<br>Nó hiện ở profile thứ 217.<\u002Fspan>\n          <span data-t=\"en\">Automation bugs do not show up in your test run.<br>They show up on profile 217.<\u002Fspan>\n        <\u002Fh2>\n        <p style=\"margin-top:20px;max-width:640px;font-size:16.5px;line-height:1.65;color:var(--dkm);text-wrap:pretty\"><span data-t=\"vi\">Một selector bám vị trí, một cổng error để trống, một ô delay bị đặt về 0 — chạy thử một lượt thì không thấy gì. Chạy 300 profile theo lịch lúc 2 giờ sáng thì thấy hết, và lúc đó dữ liệu đã sai rồi.<\u002Fspan><span data-t=\"en\">A positional selector, an empty error port, a delay hand-set to zero — a single test run shows none of it. Three hundred scheduled profiles at 2am show all of it, and by then the data is already wrong.<\u002Fspan><\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:34px;padding-top:30px;border-top:1px solid var(--dkl)\">\n          <div><p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#6d7075\">resilience<\u002Fp><p style=\"margin-top:8px;font-size:14.5px;line-height:1.6;color:var(--dkm)\"><span data-t=\"vi\">Chạy được một lần không có nghĩa là chạy được lần thứ hai.<\u002Fspan><span data-t=\"en\">Running once does not mean running twice.<\u002Fspan><\u002Fp><\u002Fdiv>\n          <div><p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#6d7075\">anti-detect<\u002Fp><p style=\"margin-top:8px;font-size:14.5px;line-height:1.6;color:var(--dkm)\"><span data-t=\"vi\">Dấu vết máy móc: nhịp truy cập, thứ tự, thời gian dừng.<\u002Fspan><span data-t=\"en\">Machine traces: cadence, ordering, dwell time.<\u002Fspan><\u002Fp><\u002Fdiv>\n          <div><p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#6d7075\">data-safety<\u002Fp><p style=\"margin-top:8px;font-size:14.5px;line-height:1.6;color:var(--dkm)\"><span data-t=\"vi\">Mất dữ liệu, hoặc báo thành công khi thật ra đã hỏng.<\u002Fspan><span data-t=\"en\">Losing data, or reporting success when it actually broke.<\u002Fspan><\u002Fp><\u002Fdiv>\n          <div><p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#6d7075\">cost<\u002Fp><p style=\"margin-top:8px;font-size:14.5px;line-height:1.6;color:var(--dkm)\"><span data-t=\"vi\">Tiền và thời gian: gọi thừa, ghi thừa, chạy thừa.<\u002Fspan><span data-t=\"en\">Money and time: redundant calls, writes, runs.<\u002Fspan><\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--dkl);padding:22px 24px\">\n        <p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#6d7075\"><span data-t=\"vi\">Cách tính điểm<\u002Fspan><span data-t=\"en\">How the score works<\u002Fspan><\u002Fp>\n        <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:0;font-family:ui-monospace,monospace;font-size:12px\">\n          <div style=\"display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--dkl)\"><span style=\"color:var(--dkm)\">max<\u002Fspan><span>100<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--dkl)\"><span style=\"display:flex;align-items:center;gap:6px;color:var(--dkm)\"><span style=\"width:7px;height:7px;background:var(--dg)\"><\u002Fspan>error<\u002Fspan><span style=\"color:var(--dg)\">−15<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--dkl)\"><span style=\"display:flex;align-items:center;gap:6px;color:var(--dkm)\"><span style=\"width:7px;height:7px;background:var(--wn)\"><\u002Fspan>warn<\u002Fspan><span style=\"color:var(--wn)\">−5<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--dkl)\"><span style=\"display:flex;align-items:center;gap:6px;color:var(--dkm)\"><span style=\"width:7px;height:7px;background:var(--st)\"><\u002Fspan>hint<\u002Fspan><span style=\"color:var(--st)\">−1<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:9px 0\"><span style=\"color:var(--dkm)\">threshold<\u002Fspan><span>85<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin-top:16px;padding-top:14px;border-top:1px solid var(--dkl);font-size:13.5px;line-height:1.6;color:var(--dkm)\"><span data-t=\"vi\">Điểm nói flow đang ở đâu. Chặn ship là do <strong style=\"color:var(--dkt);font-weight:500\">đếm lỗi error<\u002Fstrong>, không do điểm — nên một lỗi thật không lọt chỉ vì phần còn lại quá sạch.<\u002Fspan><span data-t=\"en\">The score says where the flow stands. Shipping is blocked by the <strong style=\"color:var(--dkt);font-weight:500\">count of errors<\u002Fstrong>, not by the score — so a real bug never slips through because the rest is too clean.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Stats\" style=\"padding:76px 34px 0\">\n  <div style=\"max-width:1280px;margin:0 auto\">\n    <div style=\"display:flex;align-items:baseline;gap:12px\">\n      <p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)\"><span data-t=\"vi\">Số liệu sản phẩm<\u002Fspan><span data-t=\"en\">Product figures<\u002Fspan><\u002Fp>\n      <p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--err)\">[<span data-t=\"vi\">chỗ trống — chờ số thật<\u002Fspan><span data-t=\"en\">placeholder — awaiting real figures<\u002Fspan>]<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:22px;border-top:1px solid var(--ln)\">\n      <div style=\"padding:26px 24px 26px 0;border-right:1px solid var(--ln2)\"><p style=\"font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:600;line-height:.9;letter-spacing:-.02em\">79<\u002Fp><p style=\"margin-top:9px;font-size:14px;color:var(--mut)\"><span data-t=\"vi\">node có handler thật<\u002Fspan><span data-t=\"en\">nodes with a real handler<\u002Fspan><\u002Fp><\u002Fdiv>\n      <div style=\"padding:26px 24px;border-right:1px solid var(--ln2)\"><p style=\"font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:600;line-height:.9;letter-spacing:-.02em\">10.000<\u002Fp><p style=\"margin-top:9px;font-size:14px;color:var(--mut)\"><span data-t=\"vi\">bước tối đa mỗi lượt chạy<\u002Fspan><span data-t=\"en\">step ceiling per run<\u002Fspan><\u002Fp><\u002Fdiv>\n      <div style=\"padding:26px 24px;border-right:1px solid var(--ln2)\"><p style=\"font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:600;line-height:.9;letter-spacing:-.02em\">7<\u002Fp><p style=\"margin-top:9px;font-size:14px;color:var(--mut)\"><span data-t=\"vi\">rule Critic, 4 nhóm<\u002Fspan><span data-t=\"en\">Critic rules, 4 groups<\u002Fspan><\u002Fp><\u002Fdiv>\n      <div style=\"padding:26px 0 26px 24px\"><p style=\"font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:600;line-height:.9;letter-spacing:-.02em\">0<\u002Fp><p style=\"margin-top:9px;font-size:14px;color:var(--mut)\"><span data-t=\"vi\">byte workflow gửi lên server<\u002Fspan><span data-t=\"en\">bytes of workflow sent to a server<\u002Fspan><\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"compare\" data-screen-label=\"Compare\" style=\"padding:96px 34px 0\">\n  <div style=\"max-width:1280px;margin:0 auto\">\n    <div style=\"max-width:760px\">\n      <p style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ac)\"><span data-t=\"vi\">So sánh<\u002Fspan><span data-t=\"en\">Compare<\u002Fspan><\u002Fp>\n      <h2 style=\"margin-top:16px;font-size:52px;letter-spacing:-.02em\"><span data-t=\"vi\">Script tự viết chạy được. Đến tháng thứ hai thì không.<\u002Fspan><span data-t=\"en\">A hand-written script works. By month two it does not.<\u002Fspan><\u002Fh2>\n      <p style=\"margin-top:18px;font-size:17px;line-height:1.62;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Không phải vì code tệ, mà vì không ai soát nó, không ai biết ai sửa gì, và không có chỗ nào cho biết lượt chạy thứ 217 đã dừng ở đâu.<\u002Fspan><span data-t=\"en\">Not because the code is bad, but because nobody reviews it, nobody knows who changed what, and nothing tells you where run 217 stopped.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"blueprint\" style=\"position:relative;margin-top:36px;border:1px solid var(--ln)\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 150px 190px 210px;column-gap:24px;padding:14px 24px;border-bottom:1px solid var(--ln);background:var(--zebra);font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)\">\n        <span><\u002Fspan>\n        <span style=\"color:var(--fg)\">HideAuto<\u002Fspan>\n        <span><span data-t=\"vi\">Script tự viết<\u002Fspan><span data-t=\"en\">Hand-written script<\u002Fspan><\u002Fspan>\n        <span><span data-t=\"vi\">Công cụ automation phổ thông<\u002Fspan><span data-t=\"en\">Generic automation tool<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 150px 190px 210px;column-gap:24px;padding:14px 24px;border-bottom:1px solid var(--ln2);align-items:center;font-size:14.5px\"><span><span data-t=\"vi\">Dựng trực quan, không cần code<\u002Fspan><span data-t=\"en\">Visual building, no code required<\u002Fspan><\u002Fspan><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:12px\">●<\u002Fspan><span style=\"color:var(--mut);font-family:ui-monospace,monospace;font-size:12px\">—<\u002Fspan><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:12px\">●<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 150px 190px 210px;column-gap:24px;padding:14px 24px;border-bottom:1px solid var(--ln2);align-items:center;font-size:14.5px\"><span><span data-t=\"vi\">Profile anti-detect có fingerprint riêng<\u002Fspan><span data-t=\"en\">Anti-detect profiles with their own fingerprint<\u002Fspan><\u002Fspan><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:12px\">●<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\"><span data-t=\"vi\">tự lo<\u002Fspan><span data-t=\"en\">roll your own<\u002Fspan><\u002Fspan><span style=\"color:var(--mut);font-family:ui-monospace,monospace;font-size:12px\">—<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 150px 190px 210px;column-gap:24px;padding:14px 24px;border-bottom:1px solid var(--ln2);align-items:center;font-size:14.5px\"><span><span data-t=\"vi\">Cửa kiểm chặn build khi flow còn lỗi<\u002Fspan><span data-t=\"en\">A gate that blocks the build while the flow has errors<\u002Fspan><\u002Fspan><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:12px\">●<\u002Fspan><span style=\"color:var(--mut);font-family:ui-monospace,monospace;font-size:12px\">—<\u002Fspan><span style=\"color:var(--mut);font-family:ui-monospace,monospace;font-size:12px\">—<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 150px 190px 210px;column-gap:24px;padding:14px 24px;border-bottom:1px solid var(--ln2);align-items:center;font-size:14.5px\"><span><span data-t=\"vi\">Git commit &amp; diff dạng graph cho từng flow<\u002Fspan><span data-t=\"en\">Git commit &amp; graph diff per flow<\u002Fspan><\u002Fspan><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:12px\">●<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\"><span data-t=\"vi\">git, nhưng diff là text<\u002Fspan><span data-t=\"en\">git, but the diff is text<\u002Fspan><\u002Fspan><span style=\"color:var(--mut);font-family:ui-monospace,monospace;font-size:12px\">—<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 150px 190px 210px;column-gap:24px;padding:14px 24px;border-bottom:1px solid var(--ln2);align-items:center;font-size:14.5px\"><span><span data-t=\"vi\">Lịch chạy + batch nhiều profile song song<\u002Fspan><span data-t=\"en\">Schedules + batches across profiles in parallel<\u002Fspan><\u002Fspan><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:12px\">●<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\">cron + <span data-t=\"vi\">tự viết<\u002Fspan><span data-t=\"en\">DIY<\u002Fspan><\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\"><span data-t=\"vi\">một phần<\u002Fspan><span data-t=\"en\">partial<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 150px 190px 210px;column-gap:24px;padding:14px 24px;border-bottom:1px solid var(--ln2);align-items:center;font-size:14.5px\"><span><span data-t=\"vi\">Log từng bước, chỉ ra chính xác chỗ dừng<\u002Fspan><span data-t=\"en\">Per-step logs that pinpoint where it stopped<\u002Fspan><\u002Fspan><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:12px\">●<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\">console.log<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\"><span data-t=\"vi\">một phần<\u002Fspan><span data-t=\"en\">partial<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 150px 190px 210px;column-gap:24px;padding:14px 24px;border-bottom:1px solid var(--ln2);align-items:center;font-size:14.5px\"><span><span data-t=\"vi\">Đóng gói flow thành .exe có sha256<\u002Fspan><span data-t=\"en\">Package a flow as a .exe with sha256<\u002Fspan><\u002Fspan><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:12px\">●<\u002Fspan><span style=\"color:var(--mut);font-family:ui-monospace,monospace;font-size:12px\">—<\u002Fspan><span style=\"color:var(--mut);font-family:ui-monospace,monospace;font-size:12px\">—<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 150px 190px 210px;column-gap:24px;padding:14px 24px;align-items:center;font-size:14.5px\"><span><span data-t=\"vi\">Chạy cục bộ — dữ liệu không rời khỏi máy<\u002Fspan><span data-t=\"en\">Runs locally — data never leaves the machine<\u002Fspan><\u002Fspan><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:12px\">●<\u002Fspan><span style=\"color:var(--ac);font-family:ui-monospace,monospace;font-size:12px\">●<\u002Fspan><span style=\"color:var(--mut);font-size:12.5px\"><span data-t=\"vi\">thường là cloud<\u002Fspan><span data-t=\"en\">usually cloud<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"pricing\" data-screen-label=\"Pricing\" style=\"padding:96px 34px 0\">\n  <div style=\"max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:60px;align-items:center\">\n    <div>\n      <p style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ac)\"><span data-t=\"vi\">Giá<\u002Fspan><span data-t=\"en\">Pricing<\u002Fspan><\u002Fp>\n      <h2 style=\"margin-top:16px;font-size:56px;letter-spacing:-.02em\"><span data-t=\"vi\">Miễn phí trong suốt beta.<\u002Fspan><span data-t=\"en\">Free for the whole beta.<\u002Fspan><\u002Fh2>\n      <p style=\"margin-top:18px;max-width:560px;font-size:17px;line-height:1.62;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Không giới hạn workflow, không giới hạn profile, không cần thẻ. Khi có bảng giá chính thức, người dùng beta được báo trước — và những gì bạn đã dựng vẫn là file trên máy bạn.<\u002Fspan><span data-t=\"en\">No workflow cap, no profile cap, no card. When real pricing lands, beta users hear it first — and everything you built is still a file on your own machine.<\u002Fspan><\u002Fp>\n      <p style=\"margin-top:22px;font-family:ui-monospace,monospace;font-size:11px;line-height:1.9;color:var(--mut)\"><span data-t=\"vi\">Bản beta hiện tại tập trung vào: workflow · Critic · lịch chạy · profile · version control.<br>AI agent dựng workflow và command palette đang tắt trong bản này.<\u002Fspan><span data-t=\"en\">This beta focuses on: workflows · Critic · schedules · profiles · version control.<br>The AI workflow agent and command palette are switched off in this build.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--ln);padding:32px 34px\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <p style=\"font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)\">Beta<\u002Fp>\n      <p style=\"margin-top:14px;font-family:'Barlow Condensed',sans-serif;font-size:76px;font-weight:600;line-height:.86;letter-spacing:-.03em\">0<span style=\"font-size:28px;color:var(--mut)\">đ<\u002Fspan><\u002Fp>\n      <p style=\"margin-top:8px;font-size:14px;color:var(--mut)\"><span data-t=\"vi\">/ tháng, trong giai đoạn beta<\u002Fspan><span data-t=\"en\">/ month, during the beta<\u002Fspan><\u002Fp>\n      <ul style=\"margin:26px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px;font-size:14.5px\">\n        <li style=\"display:flex;gap:10px\"><span style=\"color:var(--ac)\">✓<\u002Fspan><span data-t=\"vi\">Không giới hạn workflow &amp; profile<\u002Fspan><span data-t=\"en\">Unlimited workflows &amp; profiles<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:10px\"><span style=\"color:var(--ac)\">✓<\u002Fspan><span data-t=\"vi\">Critic, gate và bảng Problems<\u002Fspan><span data-t=\"en\">Critic, the gate and the Problems table<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:10px\"><span style=\"color:var(--ac)\">✓<\u002Fspan><span data-t=\"vi\">Lịch chạy &amp; batch song song<\u002Fspan><span data-t=\"en\">Schedules &amp; parallel batches<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:10px\"><span style=\"color:var(--ac)\">✓<\u002Fspan><span data-t=\"vi\">Version control &amp; graph diff<\u002Fspan><span data-t=\"en\">Version control &amp; graph diff<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:10px\"><span style=\"color:var(--ac)\">✓<\u002Fspan><span data-t=\"vi\">Đóng gói workflow thành .exe<\u002Fspan><span data-t=\"en\">Package workflows as .exe<\u002Fspan><\u002Fli>\n      <\u002Ful>\n      <a href=\"#download\" style=\"display:block;margin-top:28px;padding:13px;background:var(--ac);color:var(--on-ac);text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;letter-spacing:.02em\"><span data-t=\"vi\">Tải bản beta<\u002Fspan><span data-t=\"en\">Download the beta<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" data-screen-label=\"FAQ\" style=\"padding:96px 34px 0\">\n  <div style=\"max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:60px;align-items:start\">\n    <div>\n      <p style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ac)\">FAQ<\u002Fp>\n      <h2 style=\"margin-top:16px;font-size:48px;letter-spacing:-.02em\"><span data-t=\"vi\">Câu hỏi thường gặp<\u002Fspan><span data-t=\"en\">Frequently asked<\u002Fspan><\u002Fh2>\n      <p style=\"margin-top:16px;font-size:15.5px;line-height:1.62;color:var(--fg2)\"><span data-t=\"vi\">Còn thắc mắc gì khác, hỏi trực tiếp — bản beta thay đổi nhanh.<\u002Fspan><span data-t=\"en\">Anything else, just ask — the beta moves fast.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-bottom:1px solid var(--ln2)\">\n      <div data-faq=\"open\" style=\"border-top:1px solid var(--ln2)\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onFaq }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;padding:20px 0;background:transparent;border:0;text-align:left;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;color:var(--fg)\"><span data-t=\"vi\">Tôi có cần biết code không?<\u002Fspan><span data-t=\"en\">Do I need to know how to code?<\u002Fspan><span data-plus=\"1\" style=\"flex-shrink:0;font-family:ui-monospace,monospace;font-size:18px;color:var(--ac)\">+<\u002Fspan><\u002Fbutton>\n        <p style=\"padding:0 0 22px;max-width:760px;font-size:15.5px;line-height:1.65;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Không. Mọi thứ dựng bằng cách kéo-thả và nối node. Khi cần đi xa hơn, có node Run JS, HTTP request và Run command để chèn logic riêng — nhưng đó là lựa chọn, không phải điều kiện.<\u002Fspan><span data-t=\"en\">No. Everything is built by dragging and connecting nodes. When you need to go further there are Run JS, HTTP request and Run command nodes for your own logic — but that is an option, not a requirement.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div data-faq=\"closed\" style=\"border-top:1px solid var(--ln2)\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onFaq }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;padding:20px 0;background:transparent;border:0;text-align:left;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;color:var(--fg)\"><span data-t=\"vi\">Critic có gọi AI không? Có tốn tiền token?<\u002Fspan><span data-t=\"en\">Does Critic call an AI? Does it cost tokens?<\u002Fspan><span data-plus=\"1\" style=\"flex-shrink:0;font-family:ui-monospace,monospace;font-size:18px;color:var(--ac)\">+<\u002Fspan><\u002Fbutton>\n        <p style=\"padding:0 0 22px;max-width:760px;font-size:15.5px;line-height:1.65;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Không. Critic v1 là bộ lint tĩnh chạy trên graph, ngay trên máy bạn — không gọi model nào, không tốn token, không gửi flow đi đâu. Vì thế cùng một flow luôn cho cùng một điểm.<\u002Fspan><span data-t=\"en\">No. Critic v1 is a static lint over the graph, running on your machine — no model calls, no tokens, nothing sent anywhere. That is why the same flow always gets the same score.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div data-faq=\"closed\" style=\"border-top:1px solid var(--ln2)\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onFaq }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;padding:20px 0;background:transparent;border:0;text-align:left;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;color:var(--fg)\"><span data-t=\"vi\">Cửa kiểm có chặn tôi lại khi tôi biết rõ mình đang làm gì?<\u002Fspan><span data-t=\"en\">Will the gate block me when I know what I am doing?<\u002Fspan><span data-plus=\"1\" style=\"flex-shrink:0;font-family:ui-monospace,monospace;font-size:18px;color:var(--ac)\">+<\u002Fspan><\u002Fbutton>\n        <p style=\"padding:0 0 22px;max-width:760px;font-size:15.5px;line-height:1.65;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Miễn trừ được, nhưng phải kèm lý do và được ghi lại. Tắt hẳn một rule cho flow đó cũng được. Điểm chung: người quyết định miễn trừ, không phải agent nào.<\u002Fspan><span data-t=\"en\">You can waive a finding, but it needs a reason and gets recorded. You can also mute a rule for that flow entirely. The common thread: a human grants the waiver, not an agent.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div data-faq=\"closed\" style=\"border-top:1px solid var(--ln2)\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onFaq }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;padding:20px 0;background:transparent;border:0;text-align:left;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;color:var(--fg)\"><span data-t=\"vi\">Điều khiển được trình duyệt nào?<\u002Fspan><span data-t=\"en\">Which browsers can it drive?<\u002Fspan><span data-plus=\"1\" style=\"flex-shrink:0;font-family:ui-monospace,monospace;font-size:18px;color:var(--ac)\">+<\u002Fspan><\u002Fbutton>\n        <p style=\"padding:0 0 22px;max-width:760px;font-size:15.5px;line-height:1.65;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Hidemium, GPM-Login và AdsPower qua provider riêng, hoặc Chromium và Firefox tích hợp sẵn trong app. Trình duyệt anti-detect khác thì kết nối qua CDP.<\u002Fspan><span data-t=\"en\">Hidemium, GPM-Login and AdsPower through dedicated providers, or the Chromium and Firefox that ship inside the app. Other anti-detect browsers connect over CDP.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div data-faq=\"closed\" style=\"border-top:1px solid var(--ln2)\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onFaq }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;padding:20px 0;background:transparent;border:0;text-align:left;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;color:var(--fg)\"><span data-t=\"vi\">Workflow của tôi lưu ở đâu?<\u002Fspan><span data-t=\"en\">Where do my workflows live?<\u002Fspan><span data-plus=\"1\" style=\"flex-shrink:0;font-family:ui-monospace,monospace;font-size:18px;color:var(--ac)\">+<\u002Fspan><\u002Fbutton>\n        <p style=\"padding:0 0 22px;max-width:760px;font-size:15.5px;line-height:1.65;color:var(--fg2);text-wrap:pretty\"><span data-t=\"vi\">Trên máy bạn: nội dung flow là file trên đĩa, danh sách và lịch nằm trong SQLite mã hoá cùng máy. Muốn có bản sao ngoài thì tự cấu hình origin git — không có bước nào bắt buộc gửi lên server.<\u002Fspan><span data-t=\"en\">On your machine: flow content is a file on disk, the list and schedules sit in an encrypted local SQLite. Want an off-machine copy? Configure a git origin yourself — no step ever requires sending any
